# Démarrage complet : application + PostgreSQL
#   docker compose up --build
# puis, au premier lancement : docker compose run --rm migrate
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos"]
      interval: 5s
      retries: 10

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DATABASE_URL: postgresql://kairos:kairos@db:5432/kairos
    command: sh -c "npx prisma migrate deploy"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://kairos:kairos@db:5432/kairos
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
